# Common defaults (used when no profile override)

# TODO: Move private/public keys out of source control before production.
# TODO: Configure smallrye.jwt.sign.key from Vault or environment variable.
# TODO: Configure mp.jwt.verify.publickey.location from JWKS endpoint in production.

quarkus:
  datasource:
    db-kind: postgresql
    username: postgres
    password: postgres
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5434/cerberus}
  http:
    port: 8080
  flyway:
    migrate-at-start: true
    locations: db/migration
  otel:
    enabled: true
    exporter:
      otlp:
        endpoint: http://localhost:4317
        protocol: grpc
  log:
    category:
      org.flywaydb:
        level: DEBUG
    console:
      format: "%d{HH:mm:ss} %-5p [%X{X-Trace-Id}] %c{1.} - %m%n"
  metrics:
    enabled: true
    path: /metrics

smallrye:
  jwt:
    sign:
      key:
        location: keys/privateKey.pem
mp:
  jwt:
    verify:
      publickey:
        location: keys/publicKey.pem
    issuer: "healthatlas"